# ============================================================
# Docker — build every app image and push to GitHub Container
# Registry (GHCR).
#
# This is a REUSABLE workflow (workflow_call). The Release
# workflow (release.yml) calls it directly after semantic-release
# produces a new version, so a version bump ALWAYS builds + pushes
# images with the matching version tag. It is also runnable
# manually (workflow_dispatch) for ad-hoc builds.
#
# Images are pushed as:
#   ghcr.io/<owner>/<repo>/<image>:<tag>
#
# Tags applied:
#   latest            — on the default branch (every release)
#   sha-<short-sha>   — immutable trace of the built commit
#   X.Y.Z / X.Y       — only when a `version` input is supplied
#                      (i.e. on a real release)
#
# GHCR requires the image name to be lowercase, so we normalize
# github.repository before building the tag list.
# ============================================================

name: Docker (GHCR)

on:
  workflow_call:
    inputs:
      version:
        description: "Semver to tag images with (e.g. 1.2.3). Leave empty for latest/sha only."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semver to tag images with (e.g. 1.2.3)."
        required: false
        default: ""

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hackhub-auth-service
            dockerfile: apps/auth-service/Dockerfile
          - image: hackhub-admin-service
            dockerfile: apps/admin-service/Dockerfile
          - image: hackhub-api-gateway
            dockerfile: apps/api-gateway/Dockerfile
          - image: hackhub-project-service
            dockerfile: apps/project-service/Dockerfile
          - image: hackhub-judge-service
            dockerfile: apps/judge-service/Dockerfile
          - image: hackhub-showcase-service
            dockerfile: apps/showcase-service/Dockerfile
          - image: hackhub-chat-service
            dockerfile: apps/chat-service/Dockerfile
          - image: hackhub-web
            dockerfile: apps/web/Dockerfile
          - image: hackhub-admin
            dockerfile: apps/admin/Dockerfile
          - image: hackhub-judge
            dockerfile: apps/judge/Dockerfile

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize image name
        id: image
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute extra version tags
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -n "$V" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "major_minor=$(echo "$V" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "major_minor=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.version }},enable=${{ steps.ver.outputs.enabled }}
            type=raw,value=${{ steps.ver.outputs.major_minor }},enable=${{ steps.ver.outputs.enabled }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
