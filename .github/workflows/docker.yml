# ============================================================
# Docker — build every app image and push to GitHub Container
# Registry (GHCR) on push to main.
#
# Images are pushed as:
#   ghcr.io/<owner>/<repo>/<image>:<tag>
#
# Tags applied:
#   latest            — every push to main
#   sha-<short-sha>   — every push to main (immutable trace)
#   vX.Y.Z / X.Y     — when the push is a release tag (from the
#                      Release workflow's semantic-release tag)
#
# GHCR requires the image name to be lowercase, so we normalize
# github.repository before building the tag list.
# ============================================================

name: Docker (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hackhub-auth-service
            dockerfile: apps/auth-service/Dockerfile
          - image: hackhub-admin-service
            dockerfile: apps/admin-service/Dockerfile
          - image: hackhub-api-gateway
            dockerfile: apps/api-gateway/Dockerfile
          - image: hackhub-project-service
            dockerfile: apps/project-service/Dockerfile
          - image: hackhub-judge-service
            dockerfile: apps/judge-service/Dockerfile
          - image: hackhub-showcase-service
            dockerfile: apps/showcase-service/Dockerfile
          - image: hackhub-chat-service
            dockerfile: apps/chat-service/Dockerfile
          - image: hackhub-web
            dockerfile: apps/web/Dockerfile
          - image: hackhub-admin
            dockerfile: apps/admin/Dockerfile
          - image: hackhub-judge
            dockerfile: apps/judge/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize image name
        id: image
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
